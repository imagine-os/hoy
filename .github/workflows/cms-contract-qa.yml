name: Frontend CMS contract QA
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  covered-feature-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:cms
      - run: node scripts/check-cms-contracts.mjs --self-test
      - run: npm run typecheck
