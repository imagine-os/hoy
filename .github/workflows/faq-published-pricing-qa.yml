name: FAQ published pricing QA
on:
  pull_request:
    paths:
      - 'src/modules/website/**'
      - 'src/components/molecule/FaqAnswer/**'
      - 'src/components/molecule/PriceTable/**'
      - 'src/data/**'
      - 'src/tenant/**'
      - 'src/i18n/**'
      - 'scripts/*faq*pricing*'
      - 'scripts/test-public-home-pricing-contract.mjs'
      - 'package*.json'
      - '.github/workflows/faq-published-pricing-qa.yml'
  workflow_dispatch:
jobs:
  faq-published-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Browser executable
        run: echo "CHROMIUM_PATH=$(node -p 'require("playwright-core").chromium.executablePath()')" >> "$GITHUB_ENV"
      - name: Projection and CMS contracts
        run: |
          node scripts/test-public-home-pricing.mjs
          node scripts/test-faq-published-pricing.mjs
          node scripts/test-faq-published-pricing-contract.mjs
      - name: Actual FAQ reader and projection lifecycle
        run: |
          node node_modules/vite/bin/vite.js --host 127.0.0.1 --strictPort --port 5813 > /tmp/faq-pricing-dev.log 2>&1 &
          faq_dev_pid=$!
          trap 'kill "$faq_dev_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do curl -fsS http://127.0.0.1:5813/ > /dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:5813/ > /dev/null
          QA_BASE=http://127.0.0.1:5813 QA_OUTPUT=/tmp/faq-pricing-ui node scripts/test-faq-published-pricing-ui.mjs
      - name: Full build
        run: npm run build
      - name: Compiled FAQ projection
        run: |
          node node_modules/vite/bin/vite.js preview --host 127.0.0.1 --strictPort --port 5812 > /tmp/faq-pricing-preview.log 2>&1 &
          faq_preview_pid=$!
          trap 'kill "$faq_preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do curl -fsS http://127.0.0.1:5812/ > /dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:5812/ > /dev/null
          QA_BASE=http://127.0.0.1:5812 QA_OUTPUT=/tmp/faq-pricing-production node scripts/test-faq-published-pricing-production.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: faq-published-pricing
          path: /tmp/faq-pricing-*
