name: Email editor QA
on:
  pull_request:
    paths:
      - 'src/notifications/**'
      - 'src/modules/notifications/**'
      - 'scripts/test-launch-emails-ui.mjs'
      - '.github/workflows/email-editor-qa.yml'
permissions:
  contents: read
jobs:
  editor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node scripts/test-launch-emails-ui.mjs
