name: Media picker QA
on:
  pull_request:
    paths: ['src/**', 'scripts/test-media-picker.mjs', 'scripts/test-content-photo-picker.mjs', 'scripts/qa-pending-payments-dev.mjs', '.github/workflows/media-picker-qa.yml']
permissions:
  contents: read
jobs:
  picker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: |
          QA_PORT=5187 node scripts/qa-pending-payments-dev.mjs &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5187/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:5187/ >/dev/null
          CHROMIUM_PATH=/usr/bin/google-chrome node scripts/test-media-picker.mjs
          CHROMIUM_PATH=/usr/bin/google-chrome node scripts/test-content-photo-picker.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-picker-qa-${{ github.event.pull_request.head.sha }}
          path: docs/screenshots/media-picker
          retention-days: 3
