name: Public finale imagery QA
on:
  push:
    branches: [fix/final-public-imagery-20261113]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/test-finale-imagery.mjs && node scripts/test-public-class-contact.mjs && node scripts/test-public-schedule-copy.mjs && node scripts/test-home-photography.mjs && node scripts/test-contacts.mjs
      - name: Render local fixtures, never send messages
        run: |
          npm run preview -- --host 127.0.0.1 --port 5510 > /tmp/public-preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5510/ >/dev/null && break; sleep 1; done
          node scripts/test-finale-imagery-ui.mjs
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
          QA_BASE: http://127.0.0.1:5510
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-finale-${{ github.sha }}
          path: qa/finale
          retention-days: 7
