name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Bind review artifact to its source and build mode
        run: node scripts/write-review-proof.mjs dist "$GITHUB_SHA" hoy
      - uses: actions/upload-artifact@v4
        with:
          name: review-bundle-${{ github.sha }}
          path: dist
          retention-days: 1
          if-no-files-found: error
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: [build, verify-subscriptions]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify-subscriptions:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: review-bundle-${{ github.sha }}
          path: ${{ runner.temp }}/review-bundle
      - name: Verify exact review artifact subscription directory locally
        run: node scripts/test-subscriptions-live.mjs hoy "${{ github.sha }}"
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
          QA_REVIEW_DIST: ${{ runner.temp }}/review-bundle
      - name: Verify exact review artifact native cursor
        run: node scripts/test-website-native-cursor.mjs "$GITHUB_SHA"
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
          QA_REVIEW_DIST: ${{ runner.temp }}/review-bundle
          WEBSITE_BASE_URL: http://127.0.0.1:5490/
          CURSOR_OUTPUT: qa/subscription-release/native-cursor
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: subscriptions-live-${{ github.sha }}
          retention-days: 14
          path: qa/subscription-release
