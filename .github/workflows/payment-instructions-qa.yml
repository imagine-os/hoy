#     paths:
#       - 'src/modules/admin/**'
#       - 'src/modules/customer/pages/PaymentMethodsPage.tsx'
#       - 'src/modules/website/pages/ContactPage.tsx'
#       - 'src/components/organism/PaymentInstructions/**'
#       - 'src/components/organism/EmailPreview/**'
#       - 'src/components/organism/SharedImageField/**'
#       - 'src/auth/**'
#       - 'src/data/**'
#       - 'scripts/*payment-instructions*'
#       - '.github/workflows/payment-instructions-qa.yml'
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: payment-instructions-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHROMIUM_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/test-payment-instructions.mjs
      - run: npm run build
      - name: Built actual-save EN/ES propagation
        run: |
          npm run preview -- --host 127.0.0.1 --strictPort --port 5662 > /tmp/payment-instructions-preview.log 2>&1 &
          ready=0
          for i in $(seq 1 30); do if curl -fsS http://127.0.0.1:5662/ >/dev/null; then ready=1; break; fi; sleep 1; done
          test "$ready" = 1
          node scripts/test-payment-instructions-ui.mjs
        env:
          QA_BASE: http://127.0.0.1:5662
          QA_OUTPUT: qa/payment-instructions/production
      - name: Read and atomic-save fault/context recovery
        run: |
          QA_PORT=5661 QA_VITE_FORCE=1 node scripts/qa-pending-payments-dev.mjs > /tmp/payment-instructions-dev.log 2>&1 &
          ready=0
          for i in $(seq 1 30); do if curl -fsS http://127.0.0.1:5661/ >/dev/null; then ready=1; break; fi; sleep 1; done
          test "$ready" = 1
          node scripts/test-payment-instructions-states.mjs
        env:
          QA_BASE: http://127.0.0.1:5661
          QA_OUTPUT: qa/payment-instructions/states
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payment-instructions-${{ github.event.pull_request.head.sha }}
          path: |
            qa/payment-instructions/
            /tmp/payment-instructions-preview.log
            /tmp/payment-instructions-dev.log
          retention-days: 7
