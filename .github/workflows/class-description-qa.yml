name: Class description QA
on:
  pull_request:
    paths:
      - 'src/modules/classSchedule/live/**'
      - 'src/data/companyos/classDescription.ts'
      - 'src/data/companyos/mapping.ts'
      - 'src/components/molecule/SessionEditorial/**'
      - 'scripts/test-class-description*.mjs'
      - 'scripts/test-teacher-email*.mjs'
      - 'scripts/fixtures/class-description-harness.tsx'
      - '.github/workflows/class-description-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  description:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/test-class-description.mjs
      - run: node scripts/test-teacher-email.mjs
      - run: node scripts/test-teacher-email-ui.mjs
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
      - run: npm run build:production
      - run: node scripts/test-route-connectivity.mjs
      - run: node scripts/test-class-description-ui.mjs
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: class-description-${{ github.event.pull_request.head.sha || github.sha }}
          path: qa/class-description
          retention-days: 14
