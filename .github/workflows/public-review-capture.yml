name: Public review screenshots
on:
  push:
    branches: [review/public-pdf-20261113]
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/capture-public-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hoy-live-public-review
          path: qa/public-review
          retention-days: 7
