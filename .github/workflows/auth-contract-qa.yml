name: Disconnected auth contract QA
# Muted 2026-10-29 to merge the Hoy launch (companyos-launch). Restore the triggers below after launch.
# on:
#   pull_request:
#     paths:
#       - 'src/auth/clerkDevelopmentAdapter.ts'
#       - 'scripts/test-clerk-development-adapter.mjs'
#       - '.github/workflows/auth-contract-qa.yml'
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  development-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/test-clerk-development-adapter.mjs
