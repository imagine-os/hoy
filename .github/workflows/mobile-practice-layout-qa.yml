name: Mobile practice layout QA
on:
  pull_request:
    paths:
      - 'src/modules/website/**'
      - 'scripts/test-mobile-practice-layout-ui.mjs'
      - '.github/workflows/mobile-practice-layout-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  responsive:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/test-mobile-practice-layout-ui.mjs
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-practice-layout-${{ github.sha }}
          path: qa/mobile-practice-layout
          retention-days: 14
