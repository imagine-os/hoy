name: Signup consent QA
on:
  pull_request:
    paths:
      - 'src/modules/customer/auth/**'
      - 'src/modules/customer/profileSave.ts'
      - 'src/auth/**'
      - 'src/data/DataContext.tsx'
      - 'src/modules/customer/legal.tsx'
      - 'src/modules/customer/legalContent.ts'
      - 'src/components/organism/LegalDocument/**'
      - 'src/modules/admin/settings.ts'
      - 'src/modules/customer/strings.ts'
      - 'src/modules/website/pages/LegalPage.tsx'
      - 'src/components/organism/SignupLegalConsent/**'
      - 'src/data/MockProvider.ts'
      - 'src/modules/admin/TablesPage.tsx'
      - 'scripts/test-signup-consent*.mjs'
      - 'scripts/test-signup-validation*.mjs'
      - 'scripts/test-signup-context-ui.mjs'
      - 'scripts/signup-context-harness.tsx'
      - 'scripts/test-customer-registration*.mjs'
      - 'scripts/test-customer-return-ui.mjs'
      - 'scripts/customer-registration-harness.tsx'
      - '.github/workflows/signup-consent-qa.yml'
permissions:
  contents: read
jobs:
  fictional-registration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify registration and existing audit/report contracts
        run: |
          node scripts/test-signup-validation.mjs
          node scripts/test-signup-consent-recovery.mjs
          node scripts/test-signup-consent.mjs
          node scripts/test-customer-registration.mjs
          node scripts/test-sensitive-audit.mjs
          node scripts/test-reporting.mjs
      - run: npm run build
      - name: Verify production signup, legal versions, guest boundaries and component states
        run: |
          npm run preview -- --host 127.0.0.1 --strictPort --port 5333 > /tmp/hoy-signup-preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5333/ >/dev/null && break; sleep 1; done
          node scripts/test-signup-consent-recovery-ui.mjs
          node scripts/test-signup-consent-ui.mjs
          QA_OUTPUT=qa/signup-consent/validation node scripts/test-signup-validation-ui.mjs
          node scripts/test-signup-consent-library.mjs
          QA_OUTPUT=qa/signup-consent/customer-return node scripts/test-customer-return-ui.mjs
        env:
          QA_BASE: http://127.0.0.1:5333
          CHROMIUM_PATH: /usr/bin/google-chrome
      - name: Verify real form delayed provider, read failure, retry and cancellation
        run: |
          QA_PORT=5334 QA_CACHE_DIR=/tmp/hoy-signup-deps node scripts/qa-pending-payments-dev.mjs > /tmp/hoy-signup-dev.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5334/ >/dev/null && break; sleep 1; done
          node scripts/test-customer-registration-states.mjs
          QA_OUTPUT=qa/signup-consent/context node scripts/test-signup-context-ui.mjs
          QA_AFTER_COMMIT=1 QA_OUTPUT=qa/signup-consent/postcommit-context node scripts/test-signup-context-ui.mjs
        env:
          QA_BASE: http://127.0.0.1:5334
          QA_OUTPUT: qa/signup-consent/async
          CHROMIUM_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signup-consent-${{ github.event.pull_request.head.sha }}
          retention-days: 14
          path: |
            qa/signup-consent/
            /tmp/hoy-signup-preview.log
            /tmp/hoy-signup-dev.log
