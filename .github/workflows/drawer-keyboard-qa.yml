name: Drawer keyboard QA
on:
  pull_request:
    paths:
      - 'src/components/organism/Drawer/**'
      - 'src/i18n/**'
      - 'scripts/*drawer-keyboard*'
      - '.github/workflows/drawer-keyboard-qa.yml'
permissions:
  contents: read
jobs:
  keyboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify actual isolated Drawer keyboard and portal lifecycle
        run: |
          npm exec vite -- --config scripts/drawer-keyboard-vite.config.mjs --port 5223 > /tmp/hoy-drawer-keyboard.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5223/scripts/drawer-keyboard-harness.html >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:5223/scripts/drawer-keyboard-harness.html >/dev/null
          node scripts/test-drawer-keyboard-ui.mjs
        env:
          QA_BASE: http://127.0.0.1:5223
          QA_OUTPUT: docs/screenshots/drawer-keyboard
          CHROMIUM_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drawer-keyboard-${{ github.event.pull_request.head.sha }}
          retention-days: 7
          path: |
            docs/screenshots/drawer-keyboard/
            /tmp/hoy-drawer-keyboard.log
